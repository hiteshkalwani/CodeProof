[project]
name = "codeproof"
version = "2.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
addopts = "--strict-markers --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
