name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codeproof
          POSTGRES_USER: codeproof
          POSTGRES_PASSWORD: codeproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeproof" --health-interval 5s --health-retries 10
    env:
      POSTGRES_DB: codeproof
      POSTGRES_USER: codeproof
      POSTGRES_PASSWORD: codeproof
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      # Includes the Docker sandbox isolation tests (the runner has Docker).
      - run: docker pull -q python:3.12-alpine && docker pull -q node:22-alpine
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # includes the TypeScript type check

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
      - run: docker compose build
