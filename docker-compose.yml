services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codeproof
      POSTGRES_USER: codeproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeproof}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "codeproof"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: codeproof
      POSTGRES_USER: codeproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeproof}
    volumes:
      # Starts sandbox containers on the host's Docker. Root-equivalent access: see docs/ARCHITECTURE.md.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
